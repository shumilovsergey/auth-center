services:
  release:
    build:
      context: .
      target: builder
    volumes:
      - ./bin:/out
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /auth-client /out/auth-client
        printf "\033[1;32m\n"
        printf "  ╔══════════════════════════════════╗\n"
        printf "  ║      AUTH-CLIENT PROD BUILD       ║\n"
        printf "  ║  Built: %-25s║\n" "$(/out/auth-client --version | sed 's/auth-client built: //')"
        printf "  ╚══════════════════════════════════╝\n"
        printf "\033[0m\n"


# docker compose -f prod-compose.yml build --no-cache && docker compose -f prod-compose.yml up