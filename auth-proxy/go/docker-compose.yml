services:

  # run locally
  proxy:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    env_file: .env

  # build linux/amd64 binary → ./bin/
  release:
    build:
      context: .
      target: builder
    volumes:
      - ./bin:/out
    entrypoint: ["cp", "/auth-proxy", "/out/auth-proxy"]
