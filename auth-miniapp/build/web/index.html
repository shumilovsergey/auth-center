<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>auth-center</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- The Telegram SDK is deliberately NOT a blocking <script> from
       telegram.org. As one, an unreachable telegram.org left the page blank
       forever instead of saying so. script.js fetches it with a timeout, so a
       failure becomes a message on screen. -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">

    <!-- Same rectangles as auth-center's login page: a framed value, then one
         big button under it. The frame holds whatever the page has to say —
         "проверяем…", then either the name that just signed in or the refusal.
         The caption above it appears only for the name, since only a name needs
         introducing. The button is deliberately a button and not a timer — see
         the header of script.js. -->
    <div class="who">
      <p id="label" class="card-label" hidden>Вы вошли как:</p>
      <div id="status" class="card-title">проверяем…</div>
    </div>

    <p id="detail" class="detail" hidden></p>

    <button id="action" type="button" class="action-btn tall" hidden></button>

  </div>

  <script src="/script.js"></script>
</body>
</html>
