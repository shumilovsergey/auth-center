services:
  release:
    build:
      context: .
      target: builder
    volumes:
      - ./bin:/out
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /auth-miniapp /out/auth-miniapp
        printf "\033[1;32m\n"
        printf "  ╔══════════════════════════════════╗\n"
        printf "  ║      AUTH-MINIAPP PROD BUILD      ║\n"
        printf "  ║  Built: %-25s║\n" "$(/out/auth-miniapp --version | sed 's/.*built: //')"
        printf "  ╚══════════════════════════════════╝\n"
        printf "\033[0m\n"


# docker compose -f prod-compose.yml build --no-cache && docker compose -f prod-compose.yml up
